<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    background: #2c2c2c;
    color: #e0e0e0;
    overflow-x: hidden;
  }

  /* Tabs */
  .tabs {
    display: flex;
    border-bottom: 1px solid #444;
    background: #333;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: #999;
    font-weight: 500;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab:hover { color: #ccc; }
  .tab.active { color: #e0e0e0; border-bottom-color: #7B61FF; }

  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  /* Form elements */
  input[type="text"], select {
    width: 100%;
    padding: 8px 10px;
    background: #1e1e1e;
    border: 1px solid #555;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 12px;
    outline: none;
  }
  input[type="text"]:focus, select:focus {
    border-color: #7B61FF;
  }

  label {
    display: block;
    margin-bottom: 4px;
    color: #aaa;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field { margin-bottom: 12px; }

  textarea {
    width: 100%;
    padding: 8px 10px;
    background: #1e1e1e;
    border: 1px solid #555;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    resize: vertical;
    min-height: 48px;
  }
  textarea:focus { border-color: #7B61FF; }
  textarea::placeholder { color: #777; }

  .snapshot-annotation {
    font-size: 11px;
    color: #aaa;
    margin-top: 3px;
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  button {
    padding: 8px 16px;
    background: #7B61FF;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    width: 100%;
    transition: background 0.15s;
  }
  button:hover { background: #6B51EF; }
  button:disabled { background: #555; cursor: not-allowed; color: #888; }

  button.secondary {
    background: #444;
    color: #ddd;
  }
  button.secondary:hover { background: #555; }

  button.danger {
    background: transparent;
    color: #F44336;
    padding: 4px 8px;
    width: auto;
    font-size: 11px;
  }
  button.danger:hover { background: rgba(244, 67, 54, 0.1); }

  /* Snapshot list */
  .snapshot-list {
    margin-top: 12px;
  }
  .snapshot-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: #363636;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .snapshot-info {
    flex: 1;
    min-width: 0;
  }
  .snapshot-label {
    font-weight: 600;
    color: #e0e0e0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .snapshot-meta {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
  }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px;
    background: #363636;
    border-radius: 4px;
  }
  .summary-stat {
    flex: 1;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
  }
  .summary-stat .count { font-size: 18px; display: block; }
  .stat-added { color: #4CAF50; }
  .stat-removed { color: #F44336; }
  .stat-modified { color: #FF9800; }

  /* Changelog entries */
  .change-section { margin-bottom: 16px; }
  .change-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #444;
  }

  .change-entry {
    padding: 8px 10px;
    background: #363636;
    border-radius: 4px;
    margin-bottom: 4px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.1s;
  }
  .change-entry:hover { background: #404040; }
  .change-entry.added { border-left-color: #4CAF50; }
  .change-entry.removed { border-left-color: #F44336; }
  .change-entry.modified { border-left-color: #FF9800; }

  .change-header {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-added { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
  .badge-removed { background: rgba(244, 67, 54, 0.2); color: #F44336; }
  .badge-modified { background: rgba(255, 152, 0, 0.2); color: #FF9800; }

  .badge-group {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 500;
    background: #444;
    color: #aaa;
  }

  .change-node-name {
    font-weight: 600;
    color: #e0e0e0;
  }
  .change-node-type {
    color: #888;
    font-size: 10px;
  }

  .change-details {
    margin-top: 6px;
    padding-left: 8px;
  }
  .prop-change {
    font-size: 11px;
    color: #bbb;
    margin-bottom: 3px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    flex-wrap: wrap;
  }
  .prop-name { color: #aaa; font-weight: 500; }
  .prop-old { color: #F44336; text-decoration: line-through; }
  .prop-new { color: #4CAF50; }
  .prop-value {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
    vertical-align: bottom;
  }

  /* Timeline panel */
  .timeline-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #2c2c2c;
    z-index: 50;
    overflow-y: auto;
    padding: 16px;
  }
  .timeline-overlay.visible { display: block; }

  .timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .timeline-title {
    font-size: 13px;
    font-weight: 700;
    color: #e0e0e0;
  }
  .timeline-subtitle {
    font-size: 11px;
    color: #888;
    margin-top: 2px;
  }
  .btn-back {
    padding: 4px 10px;
    background: #444;
    color: #ddd;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    width: auto;
  }
  .btn-back:hover { background: #555; }

  .timeline-step {
    position: relative;
    padding: 10px 12px 10px 24px;
    margin-bottom: 2px;
    background: #363636;
    border-radius: 4px;
  }
  .timeline-step::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #555;
  }
  .timeline-step:first-child::before { top: 50%; }
  .timeline-step:last-child::before { bottom: 50%; }
  .timeline-step:only-child::before { display: none; }
  .timeline-step::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #7B61FF;
    border: 2px solid #2c2c2c;
    z-index: 1;
  }
  .timeline-step-label {
    font-weight: 600;
    font-size: 12px;
    color: #e0e0e0;
  }
  .timeline-step-date {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
  }
  .timeline-step-changes {
    margin-top: 6px;
  }
  .timeline-prop {
    font-size: 11px;
    color: #bbb;
    margin-bottom: 2px;
  }
  .timeline-prop .prop-name { color: #aaa; font-weight: 500; }
  .timeline-prop .prop-new { color: #4CAF50; }
  .timeline-prop .prop-old { color: #F44336; text-decoration: line-through; }
  .timeline-no-change {
    font-size: 11px;
    color: #666;
    font-style: italic;
  }

  /* Filter bar */
  .filter-bar {
    margin-bottom: 12px;
  }
  .filter-bar input[type="text"] {
    margin-bottom: 8px;
  }
  .filter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .filter-chip {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid #555;
    background: transparent;
    color: #999;
    width: auto;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .filter-chip:hover { border-color: #888; color: #ccc; background: transparent; }
  .filter-chip.active { border-color: #7B61FF; color: #7B61FF; background: rgba(123, 97, 255, 0.1); }
  .filter-chip.active:hover { background: rgba(123, 97, 255, 0.15); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    background: #1e1e1e;
    color: #e0e0e0;
    padding: 10px 14px;
    border-radius: 4px;
    border: 1px solid #555;
    font-size: 12px;
    z-index: 100;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .toast.error { border-color: #F44336; }

  .empty-state {
    text-align: center;
    color: #888;
    padding: 24px 16px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-tab="capture">Capture</div>
  <div class="tab" data-tab="compare">Compare</div>
  <div class="tab" data-tab="changelog">Changelog</div>
</div>

<!-- Capture Tab -->
<div id="tab-capture" class="tab-content active">
  <div class="field">
    <label>Snapshot Label</label>
    <input type="text" id="snapshot-label" placeholder="e.g. v1 - Initial design">
  </div>
  <div class="field">
    <label>Why? (optional)</label>
    <textarea id="snapshot-annotation" rows="2" placeholder="e.g. Adjusted spacing after design review"></textarea>
  </div>
  <button id="btn-capture">Capture Snapshot</button>
  <div class="snapshot-list" id="snapshot-list"></div>
</div>

<!-- Compare Tab -->
<div id="tab-compare" class="tab-content">
  <div class="field">
    <label>From (older)</label>
    <select id="select-from"><option value="">Loading...</option></select>
  </div>
  <div class="field">
    <label>To (newer)</label>
    <select id="select-to"><option value="">Loading...</option></select>
  </div>
  <button id="btn-compare" disabled>Compare Snapshots</button>
</div>

<!-- Changelog Tab -->
<div id="tab-changelog" class="tab-content">
  <div id="changelog-empty" class="empty-state">
    Compare two snapshots to see changes here.
  </div>
  <div id="changelog-content" style="display: none;">
    <div class="summary-bar" id="summary-bar"></div>
    <div class="filter-bar">
      <input type="text" id="changelog-search" placeholder="Search by node name...">
      <div class="filter-chips">
        <button class="filter-chip active" data-group="all">All</button>
        <button class="filter-chip" data-group="structure">Structure</button>
        <button class="filter-chip" data-group="layout">Layout</button>
        <button class="filter-chip" data-group="style">Style</button>
        <button class="filter-chip" data-group="typography">Typography</button>
        <button class="filter-chip" data-group="naming">Naming</button>
      </div>
    </div>
    <div id="changelog-entries"></div>
    <button id="btn-export" class="secondary" style="margin-top: 12px;">Copy as Markdown</button>
  </div>
</div>

<div class="timeline-overlay" id="timeline-overlay">
  <div class="timeline-header">
    <div>
      <div class="timeline-title" id="timeline-title"></div>
      <div class="timeline-subtitle" id="timeline-subtitle"></div>
    </div>
    <button class="btn-back" id="btn-timeline-back">Back</button>
  </div>
  <div id="timeline-entries"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // State
  let snapshots = [];
  let currentChangelog = null;

  // Elements
  const tabs = document.querySelectorAll('.tab');
  const tabContents = document.querySelectorAll('.tab-content');
  const snapshotLabel = document.getElementById('snapshot-label');
  const snapshotAnnotation = document.getElementById('snapshot-annotation');
  const btnCapture = document.getElementById('btn-capture');
  const snapshotList = document.getElementById('snapshot-list');
  const selectFrom = document.getElementById('select-from');
  const selectTo = document.getElementById('select-to');
  const btnCompare = document.getElementById('btn-compare');
  const changelogEmpty = document.getElementById('changelog-empty');
  const changelogContent = document.getElementById('changelog-content');
  const summaryBar = document.getElementById('summary-bar');
  const changelogEntries = document.getElementById('changelog-entries');
  const btnExport = document.getElementById('btn-export');
  const toast = document.getElementById('toast');
  const changelogSearch = document.getElementById('changelog-search');
  const filterChips = document.querySelectorAll('.filter-chip');

  // Tab switching
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tabContents.forEach(tc => tc.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');

      if (tab.dataset.tab === 'compare') {
        parent.postMessage({ pluginMessage: { type: 'list-snapshots' } }, '*');
      }
    });
  });

  // Toast
  let toastTimer;
  function showToast(message, isError) {
    toast.textContent = message;
    toast.className = 'toast visible' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = 'toast'; }, 3000);
  }

  // Capture
  btnCapture.addEventListener('click', () => {
    const label = snapshotLabel.value.trim();
    if (!label) {
      showToast('Please enter a label for the snapshot.', true);
      return;
    }
    const annotation = snapshotAnnotation.value.trim();
    parent.postMessage({ pluginMessage: { type: 'capture-snapshot', label, annotation: annotation || undefined } }, '*');
    snapshotLabel.value = '';
    snapshotAnnotation.value = '';
  });

  // Render snapshot list
  function renderSnapshotList() {
    if (snapshots.length === 0) {
      snapshotList.innerHTML = '<div class="empty-state">No snapshots yet. Select a frame and capture one.</div>';
      return;
    }
    snapshotList.innerHTML = snapshots.map(s => {
      const date = new Date(s.timestamp).toLocaleString();
      const annotationHtml = s.annotation
        ? '<div class="snapshot-annotation" title="' + esc(s.annotation) + '">' + esc(s.annotation) + '</div>'
        : '';
      return `
        <div class="snapshot-item">
          <div class="snapshot-info">
            <div class="snapshot-label">${esc(s.label)}</div>
            <div class="snapshot-meta">${esc(s.rootNodeName)} · ${s.nodeCount} nodes · ${date}</div>
            ${annotationHtml}
          </div>
          <button class="danger" onclick="deleteSnapshot('${s.id}')">Delete</button>
        </div>
      `;
    }).join('');
  }

  // Render select dropdowns
  function renderSelects() {
    const options = snapshots.map(s =>
      `<option value="${s.id}">${esc(s.label)} (${new Date(s.timestamp).toLocaleDateString()})</option>`
    ).join('');

    if (snapshots.length < 2) {
      selectFrom.innerHTML = '<option value="">Need at least 2 snapshots</option>';
      selectTo.innerHTML = '<option value="">Need at least 2 snapshots</option>';
      btnCompare.disabled = true;
    } else {
      selectFrom.innerHTML = options;
      selectTo.innerHTML = options;
      // Default: first=from, last=to
      selectFrom.selectedIndex = 0;
      selectTo.selectedIndex = snapshots.length - 1;
      btnCompare.disabled = false;
    }
  }

  // Delete
  window.deleteSnapshot = function(id) {
    parent.postMessage({ pluginMessage: { type: 'delete-snapshot', id } }, '*');
  };

  // Compare
  btnCompare.addEventListener('click', () => {
    const fromId = selectFrom.value;
    const toId = selectTo.value;
    if (!fromId || !toId) return;
    if (fromId === toId) {
      showToast('Please select two different snapshots.', true);
      return;
    }
    parent.postMessage({ pluginMessage: { type: 'compare-snapshots', fromId, toId } }, '*');
  });

  // Render changelog
  function renderChangelog(changelog) {
    currentChangelog = changelog;
    changelogEmpty.style.display = 'none';
    changelogContent.style.display = 'block';

    // Reset filters
    activeGroup = 'all';
    changelogSearch.value = '';
    filterChips.forEach(function(c) { c.classList.remove('active'); });
    filterChips[0].classList.add('active');

    const s = changelog.summary;
    summaryBar.innerHTML = `
      <div class="summary-stat stat-added"><span class="count">+${s.added}</span>added</div>
      <div class="summary-stat stat-removed"><span class="count">-${s.removed}</span>removed</div>
      <div class="summary-stat stat-modified"><span class="count">~${s.modified}</span>modified</div>
    `;

    let html = '';

    const added = changelog.entries.filter(e => e.category === 'added');
    const removed = changelog.entries.filter(e => e.category === 'removed');
    const modified = changelog.entries.filter(e => e.category === 'modified');

    if (added.length) {
      html += '<div class="change-section"><div class="change-section-title stat-added">Added</div>';
      html += added.map(e => renderEntry(e)).join('');
      html += '</div>';
    }
    if (removed.length) {
      html += '<div class="change-section"><div class="change-section-title stat-removed">Removed</div>';
      html += removed.map(e => renderEntry(e)).join('');
      html += '</div>';
    }
    if (modified.length) {
      html += '<div class="change-section"><div class="change-section-title stat-modified">Modified</div>';
      html += modified.map(e => renderEntry(e)).join('');
      html += '</div>';
    }

    if (!added.length && !removed.length && !modified.length) {
      html = '<div class="empty-state">No changes detected between these snapshots.</div>';
    }

    changelogEntries.innerHTML = html;

    // Switch to changelog tab
    tabs.forEach(t => t.classList.remove('active'));
    tabContents.forEach(tc => tc.classList.remove('active'));
    document.querySelector('[data-tab="changelog"]').classList.add('active');
    document.getElementById('tab-changelog').classList.add('active');
  }

  // Filter state
  var activeGroup = 'all';

  filterChips.forEach(function(chip) {
    chip.addEventListener('click', function() {
      filterChips.forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      activeGroup = chip.dataset.group;
      renderFilteredChangelog();
    });
  });

  changelogSearch.addEventListener('input', function() {
    renderFilteredChangelog();
  });

  function renderFilteredChangelog() {
    if (!currentChangelog) return;

    var searchTerm = changelogSearch.value.trim().toLowerCase();
    var filtered = currentChangelog.entries.filter(function(entry) {
      // Filter by node name search
      if (searchTerm && entry.nodeName.toLowerCase().indexOf(searchTerm) === -1) {
        return false;
      }
      // Filter by change group
      if (activeGroup === 'all') return true;
      // Added/removed entries have no change groups, show them only when "all"
      if (entry.category === 'added' || entry.category === 'removed') return false;
      // Modified entries: check if any change matches the selected group
      return entry.changes.some(function(c) { return c.group === activeGroup; });
    });

    var added = filtered.filter(function(e) { return e.category === 'added'; });
    var removed = filtered.filter(function(e) { return e.category === 'removed'; });
    var modified = filtered.filter(function(e) { return e.category === 'modified'; });

    var html = '';
    if (added.length) {
      html += '<div class="change-section"><div class="change-section-title stat-added">Added</div>';
      html += added.map(function(e) { return renderEntry(e); }).join('');
      html += '</div>';
    }
    if (removed.length) {
      html += '<div class="change-section"><div class="change-section-title stat-removed">Removed</div>';
      html += removed.map(function(e) { return renderEntry(e); }).join('');
      html += '</div>';
    }
    if (modified.length) {
      html += '<div class="change-section"><div class="change-section-title stat-modified">Modified</div>';
      html += modified.map(function(e) { return renderEntry(e); }).join('');
      html += '</div>';
    }

    if (!html) {
      html = '<div class="empty-state">No changes match your filters.</div>';
    }

    changelogEntries.innerHTML = html;
  }

  function renderEntry(entry) {
    const badge = `<span class="badge badge-${entry.category}">${entry.category}</span>`;
    let details = '';

    if (entry.changes && entry.changes.length) {
      details = '<div class="change-details">' + entry.changes.map(c =>
        `<div class="prop-change">
          <span class="badge-group">${c.group}</span>
          <span class="prop-name">${esc(c.property)}</span>
          <span class="prop-old prop-value" title="${esc(c.oldValue)}">${esc(truncate(c.oldValue))}</span>
          →
          <span class="prop-new prop-value" title="${esc(c.newValue)}">${esc(truncate(c.newValue))}</span>
        </div>`
      ).join('') + '</div>';
    }

    return `
      <div class="change-entry ${entry.category}">
        <div class="change-header" onclick="highlightNode('${entry.nodeId}')">
          ${badge}
          <span class="change-node-name">${esc(entry.nodeName)}</span>
          <span class="change-node-type">${entry.nodeType}</span>
        </div>
        ${details}
        <button class="secondary" style="margin-top:6px;padding:3px 8px;font-size:10px;width:auto;" onclick="event.stopPropagation();showNodeTimeline('${entry.nodeId}','${esc(entry.nodeName).replace(/'/g, "\\'")}')">View Timeline</button>
      </div>
    `;
  }

  // Highlight node in Figma
  window.highlightNode = function(nodeId) {
    parent.postMessage({ pluginMessage: { type: 'highlight-node', nodeId } }, '*');
  };

  // Timeline
  var timelineOverlay = document.getElementById('timeline-overlay');
  var timelineTitle = document.getElementById('timeline-title');
  var timelineSubtitle = document.getElementById('timeline-subtitle');
  var timelineEntries = document.getElementById('timeline-entries');
  var btnTimelineBack = document.getElementById('btn-timeline-back');

  window.showNodeTimeline = function(nodeId, nodeName) {
    timelineTitle.textContent = nodeName;
    timelineSubtitle.textContent = 'Loading timeline...';
    timelineEntries.innerHTML = '';
    timelineOverlay.classList.add('visible');
    parent.postMessage({ pluginMessage: { type: 'node-timeline', nodeId: nodeId, nodeName: nodeName } }, '*');
  };

  btnTimelineBack.addEventListener('click', function() {
    timelineOverlay.classList.remove('visible');
  });

  var TRACKED_PROPS = [
    'name', 'visible', 'locked', 'isMask', 'clipsContent',
    'x', 'y', 'width', 'height', 'rotation', 'constraints',
    'minWidth', 'maxWidth', 'minHeight', 'maxHeight',
    'layoutMode', 'layoutWrap', 'itemSpacing', 'counterAxisSpacing',
    'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft',
    'primaryAxisSizingMode', 'counterAxisSizingMode',
    'primaryAxisAlignItems', 'counterAxisAlignItems',
    'layoutSizingHorizontal', 'layoutSizingVertical',
    'layoutAlign', 'layoutGrow', 'layoutPositioning',
    'opacity', 'blendMode', 'fills', 'strokes', 'effects',
    'cornerRadius', 'cornerSmoothing',
    'topLeftRadius', 'topRightRadius', 'bottomLeftRadius', 'bottomRightRadius',
    'strokeWeight', 'strokeAlign', 'strokeCap', 'strokeJoin', 'dashPattern',
    'strokeTopWeight', 'strokeBottomWeight', 'strokeLeftWeight', 'strokeRightWeight',
    'characters', 'fontSize', 'fontName', 'fontWeight',
    'textAlignHorizontal', 'textAlignVertical', 'textAutoResize',
    'lineHeight', 'letterSpacing', 'textDecoration', 'textCase',
    'paragraphIndent', 'paragraphSpacing'
  ];

  function renderTimeline(data) {
    timelineTitle.textContent = data.nodeName;
    var count = data.timeline.length;
    timelineSubtitle.textContent = 'Found in ' + count + ' snapshot' + (count !== 1 ? 's' : '');

    if (count === 0) {
      timelineEntries.innerHTML = '<div class="empty-state">This node was not found in any snapshots.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < data.timeline.length; i++) {
      var step = data.timeline[i];
      var prev = i > 0 ? data.timeline[i - 1] : null;
      var date = new Date(step.timestamp).toLocaleString();

      var changesHtml = '';
      if (prev) {
        var changes = [];
        for (var p = 0; p < TRACKED_PROPS.length; p++) {
          var prop = TRACKED_PROPS[p];
          var oldVal = String(prev.node[prop] !== undefined ? prev.node[prop] : '');
          var newVal = String(step.node[prop] !== undefined ? step.node[prop] : '');
          if (oldVal !== newVal) {
            changes.push(
              '<div class="timeline-prop">' +
                '<span class="prop-name">' + esc(prop) + '</span> ' +
                '<span class="prop-old">' + esc(truncate(oldVal, 30)) + '</span> → ' +
                '<span class="prop-new">' + esc(truncate(newVal, 30)) + '</span>' +
              '</div>'
            );
          }
        }
        if (changes.length > 0) {
          changesHtml = '<div class="timeline-step-changes">' + changes.join('') + '</div>';
        } else {
          changesHtml = '<div class="timeline-no-change">No changes from previous snapshot</div>';
        }
      } else {
        changesHtml = '<div class="timeline-no-change">First appearance</div>';
      }

      html += '<div class="timeline-step">' +
        '<div class="timeline-step-label">' + esc(step.snapshotLabel) + '</div>' +
        '<div class="timeline-step-date">' + date + '</div>' +
        changesHtml +
      '</div>';
    }

    timelineEntries.innerHTML = html;
  }

  // Export as Markdown
  btnExport.addEventListener('click', () => {
    if (!currentChangelog) return;
    parent.postMessage({ pluginMessage: { type: 'export-changelog', changelog: currentChangelog } }, '*');
  });

  // Helpers
  function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }

  function truncate(str, max) {
    max = max || 40;
    if (!str) return '';
    return str.length > max ? str.substring(0, max) + '...' : str;
  }

  // Auto-versioning
  function getNextVersionLabel(snaps) {
    var max = 0;
    for (var i = 0; i < snaps.length; i++) {
      var match = snaps[i].label.match(/^v(\d+)/i);
      if (match) {
        var num = parseInt(match[1], 10);
        if (num > max) max = num;
      }
    }
    return 'v' + (max + 1);
  }

  function prefillLabel() {
    var current = snapshotLabel.value.trim();
    if (current === '' || /^v\d+$/.test(current)) {
      snapshotLabel.value = getNextVersionLabel(snapshots);
    }
  }

  // Messages from plugin
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    switch (msg.type) {
      case 'snapshot-list':
        snapshots = msg.snapshots || [];
        renderSnapshotList();
        renderSelects();
        prefillLabel();
        break;

      case 'snapshot-saved':
        showToast(msg.message, false);
        break;

      case 'snapshot-deleted':
        showToast(msg.message, false);
        break;

      case 'changelog-result':
        renderChangelog(msg.changelog);
        showToast('Changelog generated.', false);
        break;

      case 'node-timeline':
        renderTimeline(msg);
        break;

      case 'export-markdown':
        // Copy to clipboard
        const textarea = document.createElement('textarea');
        textarea.value = msg.markdown;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('Markdown copied to clipboard!', false);
        break;

      case 'error':
        showToast(msg.message, true);
        break;
    }
  };

  // Initial load
  parent.postMessage({ pluginMessage: { type: 'list-snapshots' } }, '*');
</script>
</body>
</html>
