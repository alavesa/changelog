<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#0d1b2e"/>

  <!-- Back frame (older snapshot) -->
  <rect x="22" y="30" width="60" height="50" rx="5" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- Corner markers on back frame -->
  <line x1="22" y1="40" x2="22" y2="30" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="30" x2="32" y2="30" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="30" x2="82" y2="30" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="30" x2="82" y2="40" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Front frame (newer snapshot) — offset, in blue -->
  <rect x="36" y="44" width="60" height="50" rx="5" fill="#0d1b2e" stroke="#60a5fa" stroke-width="3"/>
  <!-- Corner markers on front frame -->
  <line x1="36" y1="54" x2="36" y2="44" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="44" x2="46" y2="44" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="86" y1="44" x2="96" y2="44" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="44" x2="96" y2="54" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>

  <!-- Small content lines inside front frame (suggesting a design) -->
  <line x1="48" y1="62" x2="84" y2="62" stroke="#1a2744" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="70" x2="75" y2="70" stroke="#1a2744" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="78" x2="80" y2="78" stroke="#1a2744" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trail dots at bottom — suggesting history/changelog -->
  <circle cx="44" cy="106" r="4" fill="#60a5fa"/>
  <circle cx="60" cy="106" r="4" fill="#60a5fa" opacity="0.6"/>
  <circle cx="76" cy="106" r="4" fill="#60a5fa" opacity="0.3"/>
</svg>
